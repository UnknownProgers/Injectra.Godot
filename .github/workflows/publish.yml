name: Publish Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      GODOT_VERSION: 4.6.1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "::error::Set the NUGET_USER repository variable to your NuGet username."
            exit 1
          fi
          version="$(dotnet msbuild Core/Core.csproj -getProperty:Version)"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must match project version 'v$version'."
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build Injectra.Godot.slnx --configuration Debug

      - name: Test method generator
        run: dotnet test Tests/Generator.Tests/Generator.Tests.csproj --configuration Debug --no-build

      - name: Install Godot .NET
        run: |
          bundle="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${bundle}.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/$bundle/${bundle%_mono_linux_x86_64}_mono_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import Godot project
        run: timeout 60 "$GODOT_BIN" --headless --path Core --editor --import

      - name: Run Godot tests
        run: |
          timeout 60 "$GODOT_BIN" --headless --path Core res://Tests/LifecycleTests.tscn 2>&1 | tee "$RUNNER_TEMP/godot-tests.log"
          grep -q '^PASS: Autoload project lifetime' "$RUNNER_TEMP/godot-tests.log"
          grep -q '^PASS: Godot frame/physics lifecycle' "$RUNNER_TEMP/godot-tests.log"
          if grep -Eq '^(ERROR:|SCRIPT ERROR:)' "$RUNNER_TEMP/godot-tests.log"; then
            exit 1
          fi

      - name: Pack method generator
        run: dotnet pack Generator/Generator.csproj --configuration Release --output release

      - name: Package addon
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          output = Path("release")
          output.mkdir(exist_ok=True)
            destination = Path("addons/injectra")
          version = os.environ["PACKAGE_VERSION"]
          with ZipFile(output / f"Injectra.Godot-{version}.zip", "w", ZIP_DEFLATED) as archive:
                for source in sorted(Path("Core/addons/injectra").rglob("*")):
                  if not source.is_file() or source.suffix not in {".cs", ".uid", ".png", ".svg", ".md", ".cfg", ".tscn"}:
                      continue
                    archive.write(source, str(destination / source.relative_to("Core/addons/injectra")))
              archive.write("LICENSE", str(destination / "LICENSE"))
          PY

      - name: Log in to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish method generator to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "release/Injectra.Godot.Generation.${PACKAGE_VERSION}.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="release/Injectra.Godot-${PACKAGE_VERSION}.zip"
          package="release/Injectra.Godot.Generation.${PACKAGE_VERSION}.nupkg"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" "$package" --clobber
          else
            options=(--verify-tag --generate-notes --title "$RELEASE_TAG")
            if [[ "$PACKAGE_VERSION" == *-* ]]; then
              options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "$archive" "$package" "${options[@]}"
          fi
